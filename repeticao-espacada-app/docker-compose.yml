services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-revisa}
      POSTGRES_USER: ${POSTGRES_USER:-revisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revisa}
    volumes:
      - revisa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revisa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-revisa}:${POSTGRES_PASSWORD:-revisa}@db:5432/${POSTGRES_DB:-revisa}
    ports:
      - "4173:8080"

volumes:
  revisa_db_data:
